<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ระบบฝ่ายกิจการนักเรียน · ร.ร.คลองพนสฤษดิ์พิทยา</title>

  <!-- ตั้งค่า PWA สำหรับ Android และ iPhone (iOS) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b2e78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="กิจการนักเรียน">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0b2e78;
      font-family: system-ui, -apple-system, 'Sarabun', sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(160deg, #0b2e78 0%, #1558c0 60%, #0a2a6e 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      background: #fff;
      border: 3px solid #f5b921;
      object-fit: cover;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
    }
    #splash b { font-size: 20px; line-height: 1.3; }
    #splash small { font-size: 13.5px; opacity: 0.85; }
    .spin {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,.28);
      border-top-color: #ffd43b;
      border-radius: 50%;
      animation: sp .8s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    #appFrame {
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #f0f5fc;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./icon-512.png" alt="ระบบกิจการนักเรียน">
    <div>
      <b>ระบบฝ่ายกิจการนักเรียน</b><br>
      <small>โรงเรียนคลองพนสฤษดิ์พิทยา</small>
    </div>
    <div class="spin"></div>
  </div>

  <iframe id="appFrame" allow="camera; clipboard-write" allowfullscreen></iframe>

  <script>
    /* 🔴 แก้ไขตรงนี้: วางลิงก์ Web App (/exec) ของ Google Apps Script โรงเรียน */
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzK2I2myyJtRjp1690NUZ8yqv6kZhEHmUfg1qS6jBuStswVKpPmQFICfHNFcA_QHXvHdA/exec';

    /* ส่งต่อพารามิเตอร์ เช่น ?card=8628 ไปยัง Apps Script อัตโนมัติ */
    const qs = window.location.search || '';
    const frame = document.getElementById('appFrame');
    frame.src = APPS_SCRIPT_URL + qs;
    frame.addEventListener('load', () => {
      const sp = document.getElementById('splash');
      if (sp) sp.classList.add('hide');
    });

    /* ลงทะเบียน Service Worker เพื่อให้ Android/Chrome ขึ้นปุ่ม "ติดตั้งแอป" */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
